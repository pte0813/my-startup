    <section class="page-head">
      <div class="wrap hero">
        <div class="hero-text">
        <p class="eyebrow" data-i18n="g_contact">연락하기</p>
        <h1 data-i18n="g_contact">연락하기</h1>
        <p class="lead" data-i18n="d_contact">문의와 채용공고를 확인하세요.</p>
        </div>
        <img class="hero-art" src="art/hero-contact.svg" alt="" width="480" height="360" loading="eager">
      </div>
    </section>

    <section id="contact-form">
      <div class="wrap">
        <h2 data-i18n="s_contact">문의하기</h2>
        <form class="form-card" id="ct-form" novalidate>
          <label><span data-i18n="auth_name">이름</span><input type="text" name="name" autocomplete="name" maxlength="100"></label>
          <label><span data-i18n="auth_email">이메일</span><input type="email" name="email" autocomplete="email" maxlength="254"></label>
          <label><span data-i18n="ct_msg">문의 내용</span><textarea name="message" rows="5" maxlength="4000"></textarea></label>
          <input class="hp" type="text" name="company" tabindex="-1" autocomplete="off" aria-hidden="true">
          <label class="consent"><input type="checkbox" name="consent"><span><span data-i18n="ct_consent">개인정보 수집·이용에 동의합니다. (필수)</span><small data-i18n="ct_consent_d">수집 항목: 이름, 이메일, 문의 내용 · 이용 목적: 문의 답변 · 보유 기간: 문의 처리가 끝날 때까지</small></span></label>
          <button class="btn" id="ct-submit" type="submit" data-i18n="ct_submit">문의 보내기</button>
          <p class="fmsg" id="ct-msg" role="status" aria-live="polite"></p>
        </form>
      </div>
    </section>

    <section id="jobs">
      <div class="wrap">
        <h2 data-i18n="s_jobs">채용공고</h2>
        <div class="empty">
          <img src="art/empty-jobs.svg" alt="" width="240" height="180" loading="lazy">
          <h3 data-i18n="job_empty_t">지금은 채용 중인 포지션이 없어요</h3>
          <p data-i18n="job_empty_d">함께하고 싶다면 문의하기로 이야기를 들려주세요.</p>
          <a class="btn ghost" href="#contact-form" data-i18n="s_contact">문의하기</a>
        </div>
      </div>
    </section>
