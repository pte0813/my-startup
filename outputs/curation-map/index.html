<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>실패 없는 선택</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root { --bg:#fff; --fg:#1f2328; --muted:#6b7280; --line:#e5e7eb; --accent:#e8590c; --warn:#b45309; --chip:#f3f4f6; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16181d; --fg:#e8e8ea; --muted:#9aa0aa; --line:#2c3037; --accent:#ff8a4c; --warn:#fbbf24; --chip:#242830; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif; }
  header { padding:12px 16px; border-bottom:1px solid var(--line); }
  h1 { margin:0 0 8px; font-size:18px; }
  .row { display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; }
  button.chip { border:1px solid var(--line); background:var(--chip); color:var(--fg); border-radius:999px; padding:6px 12px; font-size:14px; cursor:pointer; }
  button.chip[aria-pressed="true"] { background:var(--accent); border-color:var(--accent); color:#fff; }
  main { display:grid; grid-template-columns:1fr 380px; height:calc(100vh - 118px); }
  #map { height:100%; min-height:300px; }
  #list { overflow:auto; border-left:1px solid var(--line); }
  .card { padding:14px 16px; border-bottom:1px solid var(--line); cursor:pointer; }
  .card.active { background:var(--chip); }
  .card h2 { margin:0 0 4px; font-size:16px; }
  .meta { color:var(--muted); font-size:13px; }
  .tag { display:inline-block; font-size:12px; padding:2px 8px; border-radius:999px; background:var(--chip); margin-right:4px; }
  .tag.ad { background:var(--warn); color:#fff; }
  .tag.stale { color:var(--warn); border:1px solid var(--warn); background:transparent; }
  .detail { margin-top:10px; font-size:14px; line-height:1.5; }
  .detail b { display:block; font-size:12px; color:var(--muted); margin-top:8px; }
  .empty { padding:24px 16px; color:var(--muted); }
  footer { padding:8px 16px; font-size:12px; color:var(--muted); }
  @media (max-width: 760px) {
    main { grid-template-columns:1fr; grid-template-rows:260px auto; height:auto; }
    #list { border-left:0; border-top:1px solid var(--line); }
  }
</style>
</head>
<body>
<header>
  <h1>실패 없는 선택 · 로컬 큐레이션 맵</h1>
  <div class="row" id="areaFilter" aria-label="동네"></div>
  <div class="row" id="sitFilter" aria-label="상황"></div>
</header>
<main>
  <div id="map" role="application" aria-label="지도"></div>
  <div id="list"></div>
</main>
<footer>샘플 데이터입니다. 협찬 표기·검증일 90일 초과 경고 포함.</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="data.js"></script>
<script>
const STALE_DAYS = 90;
const SITUATIONS = ["전체", "데이트", "혼밥", "팀 회식"];
const state = { area: "성수", sit: "전체", selected: null };
const markers = new Map();
let map = null;

const daysSince = d => Math.floor((Date.now() - new Date(d)) / 86400000);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function chips(el, items, key) {
  el.innerHTML = "";
  items.forEach(v => {
    const b = document.createElement("button");
    b.className = "chip"; b.textContent = v;
    b.setAttribute("aria-pressed", state[key] === v);
    b.onclick = () => { state[key] = v; state.selected = null; render(true); };
    el.appendChild(b);
  });
}

function visible() {
  return PLACES.filter(p => p.area === state.area && (state.sit === "전체" || p.situations.includes(state.sit)));
}

function render(recenter) {
  chips(document.getElementById("areaFilter"), Object.keys(AREAS), "area");
  chips(document.getElementById("sitFilter"), SITUATIONS, "sit");
  const items = visible();

  const list = document.getElementById("list");
  list.innerHTML = items.length ? "" : '<div class="empty">조건에 맞는 장소가 없습니다.</div>';
  items.forEach(p => {
    const age = daysSince(p.verified);
    const open = state.selected === p.id;
    const el = document.createElement("div");
    el.className = "card" + (open ? " active" : "");
    el.innerHTML = `
      <h2>${esc(p.name)}</h2>
      <div class="meta">${esc(p.category)} · ${esc(p.price)} · ${esc(p.summary)}</div>
      <div style="margin-top:6px">
        ${p.situations.map(s => `<span class="tag">${esc(s)}</span>`).join("")}
        ${p.sponsored ? '<span class="tag ad">협찬</span>' : ""}
        ${age > STALE_DAYS ? `<span class="tag stale">검증 ${age}일 지남</span>` : ""}
      </div>
      ${open ? `<div class="detail">
        <b>웨이팅 팁</b>${esc(p.waiting)}
        <b>예약 요령</b>${esc(p.reservation)}
        <b>마지막 검증</b>${esc(p.verified)}
      </div>` : ""}`;
    el.onclick = () => { state.selected = open ? null : p.id; render(false); };
    list.appendChild(el);
  });

  if (!map) return;
  markers.forEach(m => m.remove()); markers.clear();
  items.forEach(p => {
    const m = L.marker([p.lat, p.lng]).addTo(map).bindTooltip(p.name);
    m.on("click", () => { state.selected = p.id; render(false); });
    markers.set(p.id, m);
  });
  const sel = items.find(p => p.id === state.selected);
  if (sel) map.panTo([sel.lat, sel.lng]);
  else if (recenter) map.setView(AREAS[state.area].center, AREAS[state.area].zoom);
}

if (window.L) {
  map = L.map("map").setView(AREAS[state.area].center, AREAS[state.area].zoom);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "© OpenStreetMap" }).addTo(map);
}
render(true);
</script>
</body>
</html>
