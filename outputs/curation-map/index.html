<title>몽몽</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  /* 레이아웃: 앱처럼 한 열(최대 640px) + 하단 탭바. 홈·검색·지도·리스트·마이 탭, 가게 상세는 전체 화면으로 덮음 */
  :root {
    --bg:#101216; --surface:#1a1d24; --surface2:#232731; --fg:#f4f5f7; --muted:#9ba2af; --line:#2b303a;
    --accent:#f08a77; --accent-soft:#3a2420; --accent-fg:#1c0f0b; --star:#f2b632; --star-off:#3a3f4a;
    --thumb-s:42%; --thumb-l:26%; --thumb-fg:#f4f5f7;
    --map:#161a21; --dot:#2d333e;
    --font:"Noto Sans KR",system-ui,-apple-system,sans-serif;
    color-scheme:dark;
  }
  @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
    --bg:#f5f6f8; --surface:#ffffff; --surface2:#eef0f4; --fg:#14171c; --muted:#5b6471; --line:#e1e4ea;
    --accent:#d4452e; --accent-soft:#fdebe7; --accent-fg:#ffffff; --star:#e5a500; --star-off:#d5d9e0;
    --thumb-s:75%; --thumb-l:88%; --thumb-fg:#2b2118; --map:#e9ecf1; --dot:#c9cfd9; color-scheme:light; } }
  :root[data-theme="light"] {
    --bg:#f5f6f8; --surface:#ffffff; --surface2:#eef0f4; --fg:#14171c; --muted:#5b6471; --line:#e1e4ea;
    --accent:#d4452e; --accent-soft:#fdebe7; --accent-fg:#ffffff; --star:#e5a500; --star-off:#d5d9e0;
    --thumb-s:75%; --thumb-l:88%; --thumb-fg:#2b2118; --map:#e9ecf1; --dot:#c9cfd9; color-scheme:light; }

  * { box-sizing:border-box; }
  body { background:var(--bg); color:var(--fg); font-family:var(--font); font-size:16px; line-height:1.6; margin:0;
    padding-top:0; padding-bottom:calc(92px + env(safe-area-inset-bottom, 0px));
    padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); word-break:keep-all; overflow-wrap:break-word; }
  button, input, select { font:inherit; color:inherit; }
  button { cursor:pointer; }
  :focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  .app { max-width:640px; margin:0 auto; }
  .muted { color:var(--muted); }
  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
  svg.i { width:24px; height:24px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex:none; }

  /* 상단바 */
  .topbar { position:sticky; top:0; z-index:20; background:var(--bg); padding:calc(12px + env(safe-area-inset-top, 0px)) 0 12px; border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:12px; box-shadow:0 0 0 100vmax var(--bg); clip-path:inset(0 -100vmax); }
  .mark { width:52px; height:52px; flex:none; filter:drop-shadow(0 5px 10px rgba(224,100,77,.35)); }
  .mark svg { display:block; width:100%; height:100%; }
  .logo { margin:0; font-size:26px; font-weight:900; letter-spacing:-.04em; color:var(--accent); line-height:1; flex:1; }
  .iconbtn { width:44px; height:44px; border-radius:14px; border:0; background:var(--surface); display:grid; place-items:center; }

  .view { display:none; padding-top:20px; }
  .app[data-tab="home"] #v-home, .app[data-tab="search"] #v-search, .app[data-tab="map"] #v-map, .app[data-tab="list"] #v-list, .app[data-tab="my"] #v-my { display:block; }
  .app[data-detail="1"] .view, .app[data-detail="1"] .topbar, .app[data-detail="1"] ~ .tabbar { display:none; }
  #v-detail { display:none; }
  .app[data-detail="1"] #v-detail { display:block; }

  /* 홈 */
  .eyebrow { margin:0 0 6px; color:var(--muted); font-size:17px; }
  .hero { margin:0 0 18px; font-size:30px; line-height:1.28; font-weight:900; letter-spacing:-.04em; text-wrap:balance; }
  .hero em { font-style:normal; color:var(--accent); }
  .pills { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:28px; }
  .pill { min-height:44px; padding:0 18px; border-radius:999px; border:1px solid var(--line); background:var(--surface); font-weight:500; font-size:15px; }
  .sec-head { display:flex; justify-content:space-between; align-items:baseline; margin:0 0 12px; }
  .sec-head h3 { margin:0; font-size:20px; font-weight:900; letter-spacing:-.03em; }
  .more { background:none; border:0; color:var(--accent); font-weight:700; font-size:15px; min-height:44px; padding:0 0 0 12px; }
  .sec { margin-bottom:32px; }
  .areagrid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; }
  .areabtn { min-height:56px; border-radius:16px; border:1px solid var(--line); background:var(--surface); display:grid; place-content:center; text-align:center; line-height:1.3; padding:6px; }
  .areabtn b { font-size:15px; }
  .areabtn small { color:var(--muted); font-size:13px; }

  /* 필터 칩 */
  .scroller { display:flex; gap:8px; overflow-x:auto; padding:2px 0 4px; scrollbar-width:none; margin-bottom:10px; }
  .scroller::-webkit-scrollbar { display:none; }
  .chip { flex:none; min-height:42px; border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:0 16px; display:inline-flex; gap:6px; align-items:center; font-size:15px; white-space:nowrap; }
  .chip small { color:var(--muted); font-size:13px; }
  .chip[aria-pressed="true"] { background:var(--accent); border-color:var(--accent); color:var(--accent-fg); font-weight:700; }
  .chip[aria-pressed="true"] small { color:var(--accent-fg); opacity:.75; }
  .page-title { margin:0 0 14px; font-size:24px; font-weight:900; letter-spacing:-.04em; }
  .count { color:var(--muted); font-size:15px; margin:4px 0 12px; }

  /* 가게 카드 (썸네일 + 평점 + 최근 후기/웨이팅) */
  .cards { display:grid; gap:14px; }
  .rc { background:var(--surface); border:1px solid var(--line); border-radius:22px; }
  .rcbtn { display:grid; grid-template-columns:88px minmax(0,1fr); gap:6px 16px; width:100%; text-align:left; background:none; border:0; padding:16px; border-radius:22px; align-items:start; }
  .thumb { grid-row:1 / span 2; width:88px; height:88px; border-radius:18px; background:hsl(var(--h) var(--thumb-s) var(--thumb-l)); color:var(--thumb-fg); display:grid; place-items:center; text-align:center; font-weight:900; font-size:17px; line-height:1.2; padding:6px; letter-spacing:-.03em; word-break:keep-all; }
  img.thumb { display:block; object-fit:cover; padding:0; background:var(--surface2); }
  .thumb.big { width:72px; height:72px; font-size:15px; border-radius:16px; grid-row:auto; }
  .rc-name { font-size:20px; font-weight:900; letter-spacing:-.03em; line-height:1.35; }
  .rc-meta { color:var(--muted); font-size:15px; }
  .rate { display:flex; align-items:center; gap:6px; margin-top:4px; font-size:15px; color:var(--muted); flex-wrap:wrap; }
  .stars { letter-spacing:1px; color:var(--star); white-space:nowrap; }
  .stars i { font-style:normal; color:var(--star-off); }
  .badge { font-size:12px; font-weight:700; padding:1px 8px; border-radius:999px; background:var(--accent-soft); color:var(--accent); }
  .badge.ad { background:var(--accent); color:var(--accent-fg); }
  .rc-foot { grid-column:2; border-top:1px solid var(--line); padding-top:10px; margin-top:4px; display:grid; gap:2px; min-width:0; }
  .rf-top { display:flex; justify-content:space-between; gap:8px; align-items:center; font-size:15px; }
  .rf-top b { font-weight:700; }
  .rf-top time { color:var(--muted); font-size:14px; font-variant-numeric:tabular-nums; }
  .rf-text { margin:0; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; font-size:16px; line-height:1.5; }
  .rf-wait b { color:var(--accent); margin-right:6px; }
  .rf-none { color:var(--muted); font-size:15px; margin:0; }
  @media (max-width:400px) { .rcbtn { grid-template-columns:72px minmax(0,1fr); gap:6px 12px; padding:14px; } .thumb { width:72px; height:72px; font-size:15px; } }

  /* 검색 */
  .searchbox { position:relative; margin-bottom:14px; }
  .searchbox svg { position:absolute; left:16px; top:50%; transform:translateY(-50%); color:var(--muted); }
  .searchbox input { width:100%; min-height:52px; border-radius:16px; border:1px solid var(--line); background:var(--surface); padding:0 16px 0 48px; font-size:17px; }
  .suggest { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px; }

  /* 지도 */
  .mapbox { background:var(--map); border:1px solid var(--line); border-radius:22px; overflow:hidden; }
  svg.map { display:block; width:100%; height:auto; }
  .area-name { fill:var(--fg); font-weight:900; font-size:17px; }
  .note { fill:var(--muted); font-size:10px; }
  .pin { cursor:pointer; outline:none; }
  .pin circle { fill:var(--accent); stroke:var(--surface); stroke-width:2.5; }
  .pin text { fill:var(--accent-fg); font-size:12px; font-weight:700; text-anchor:middle; dominant-baseline:central; pointer-events:none; }
  .pin.stale circle { fill:var(--surface); stroke:var(--accent); }
  .pin.stale text { fill:var(--accent); }
  .pin.sel circle, .pin:focus-visible circle { stroke:var(--fg); stroke-width:3.5; }
  .lbl rect { fill:var(--fg); }
  .lbl text { fill:var(--bg); font-size:11px; font-weight:700; text-anchor:middle; dominant-baseline:central; }
  .legend { display:flex; gap:14px; flex-wrap:wrap; padding:10px 14px; border-top:1px solid var(--line); background:var(--surface); font-size:13px; color:var(--muted); }
  .legend i { display:inline-block; width:12px; height:12px; border-radius:50%; vertical-align:-1px; margin-right:6px; }
  .legend .on { background:var(--accent); }
  .legend .off { border:2px solid var(--accent); }
  .mapsum { margin-top:14px; }
  .hint { color:var(--muted); text-align:center; margin:14px 0 0; font-size:15px; }

  /* 상세 */
  .dbar { position:sticky; top:0; z-index:20; background:var(--bg); display:flex; align-items:center; gap:8px; padding:calc(8px + env(safe-area-inset-top, 0px)) 0 8px; border-bottom:1px solid var(--line); box-shadow:0 0 0 100vmax var(--bg); clip-path:inset(0 -100vmax); }
  .back { min-height:44px; border:0; background:none; font-weight:700; color:var(--accent); padding:0 8px 0 0; font-size:17px; display:flex; align-items:center; gap:4px; }
  .crumb { color:var(--muted); font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
  .dbody { padding:20px 0 40px; display:grid; gap:18px; }
  .dhead { display:grid; grid-template-columns:72px minmax(0,1fr); gap:16px; align-items:center; }
  .dhead h2 { margin:0; font-size:26px; font-weight:900; letter-spacing:-.04em; line-height:1.3; text-wrap:balance; }
  .dsum { margin:0; color:var(--muted); }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:22px; padding:18px; display:grid; gap:12px; }
  .card h3 { margin:0; font-size:18px; font-weight:900; letter-spacing:-.03em; display:flex; align-items:baseline; gap:8px; }
  .card h3 .when { font-size:13px; font-weight:500; color:var(--muted); letter-spacing:0; }
  .info { margin:0; display:grid; gap:10px; }
  .info > div { background:var(--surface2); border-radius:14px; padding:12px 14px; }
  .info > div.key { background:var(--accent-soft); }
  dt { font-size:13px; font-weight:700; color:var(--muted); margin-bottom:2px; }
  .key dt { color:var(--accent); }
  dd { margin:0; overflow-wrap:anywhere; }
  dd.tbd { color:var(--muted); }
  .src { font-size:13px; color:var(--muted); margin:0; }
  .btnrow { display:flex; gap:8px; flex-wrap:wrap; }
  .btn { min-height:50px; border:0; border-radius:16px; padding:0 22px; background:var(--accent); color:var(--accent-fg); font-weight:700; display:inline-flex; align-items:center; justify-content:center; text-decoration:none; font-size:16px; }
  .btn:disabled { opacity:.5; cursor:default; }
  .btn.ghost { background:var(--surface2); color:var(--fg); }
  .btn.sm { min-height:42px; padding:0 16px; font-size:14px; border-radius:14px; }
  .btn.full { width:100%; }
  .pager { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
  .pager .btn { justify-content:space-between; min-width:0; gap:6px; }
  .pager .btn span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  /* 후기 */
  .rvlist { list-style:none; margin:0; padding:0; display:grid; gap:10px; }
  .rv { background:var(--surface2); border-radius:14px; padding:12px 14px; display:grid; gap:4px; }
  .rv-top { display:flex; gap:8px; flex-wrap:wrap; align-items:center; font-size:14px; }
  .rv-date { color:var(--muted); font-variant-numeric:tabular-nums; }
  .rv-text, .rv-tip { margin:0; overflow-wrap:anywhere; }
  .rv-tip { font-size:15px; color:var(--muted); }
  .rv-tip b { color:var(--accent); margin-right:4px; }
  .link-btn { justify-self:start; background:none; border:0; padding:8px 0; color:var(--muted); font-size:14px; text-decoration:underline; min-height:36px; }
  .rvform { display:grid; gap:14px; background:var(--surface2); border-radius:18px; padding:16px; }
  .rvform h4 { margin:0; font-size:17px; font-weight:900; }
  .field { display:grid; gap:4px; min-width:0; }
  .flabel { font-size:14px; font-weight:700; color:var(--muted); }
  .two { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
  @media (max-width:480px) { .two { grid-template-columns:minmax(0,1fr); } }
  input[type="text"], input[type="date"], input[type="number"], select { width:100%; min-height:48px; color:var(--fg); background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:0 12px; min-width:0; }
  .check { display:flex; gap:10px; align-items:flex-start; font-size:15px; }
  .check input { width:20px; height:20px; margin-top:3px; accent-color:var(--accent); }
  .checks { display:flex; gap:16px; flex-wrap:wrap; }
  .rate-in { display:flex; gap:2px; }
  .star { background:none; border:0; font-size:36px; line-height:1; min-width:46px; min-height:46px; color:var(--star-off); padding:0; }
  .star.on { color:var(--star); }
  .actions { display:flex; gap:8px; flex-wrap:wrap; }
  .err { margin:0; color:var(--accent); font-weight:700; }

  /* 마이 */
  .stat { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
  .stat div { background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:14px 16px; }
  .stat b { display:block; font-size:26px; font-weight:900; font-variant-numeric:tabular-nums; }
  .stat span { color:var(--muted); font-size:14px; }
  .myrv { cursor:pointer; text-align:left; width:100%; border:0; background:var(--surface2); border-radius:14px; padding:12px 14px; display:grid; gap:2px; }
  .about { color:var(--muted); font-size:14px; display:grid; gap:10px; }
  .about p { margin:0; }
  .about a { color:var(--accent); }
  .photoact { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:8px; }
  .empty { color:var(--muted); padding:32px 16px; text-align:center; border:1px dashed var(--line); border-radius:22px; background:var(--surface); }

  .toast { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(100px + env(safe-area-inset-bottom, 0px)); background:var(--fg); color:var(--bg); padding:12px 18px; border-radius:999px; font-size:15px; z-index:60; max-width:calc(100vw - 32px); }

  /* 하단 탭바 */
  .tabbar { position:fixed; left:0; right:0; bottom:0; z-index:50; background:var(--surface); border-top:1px solid var(--line);
    padding:8px max(8px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
  .tabs { max-width:640px; margin:0 auto; display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:4px; }
  .tab { min-height:58px; border:0; background:none; border-radius:16px; color:var(--muted); display:grid; place-items:center; align-content:center; gap:2px; font-size:13px; font-weight:700; }
  .tab[aria-current="page"] { background:var(--accent-soft); color:var(--accent); }
  @media (prefers-reduced-motion: no-preference) { .chip, .tab, .rc { transition:background .15s, color .15s, border-color .15s; } }
</style>

<div class="app" id="app" data-tab="home" data-detail="0">
  <header class="topbar">
    <div class="mark" aria-hidden="true"><svg viewBox="0 0 64 64"><defs><linearGradient id="mg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffc2b3"/><stop offset="1" stop-color="#f0735d"/></linearGradient></defs>
      <path d="M33 15c-1-6 2-10 8-11 1 6-2 10-8 11z" fill="#62c99c"/><path d="M33 16v5" stroke="#3f9f77" stroke-width="2" stroke-linecap="round"/>
      <g fill="url(#mg)"><circle cx="21" cy="37" r="13"/><circle cx="34" cy="29" r="15"/><circle cx="46" cy="37" r="13"/><rect x="14" y="36" width="40" height="19" rx="9.5"/></g>
      <ellipse cx="26.5" cy="39" rx="2.7" ry="3.5" fill="#3b1d17"/><ellipse cx="41.5" cy="39" rx="2.7" ry="3.5" fill="#3b1d17"/>
      <circle cx="25.7" cy="37.7" r="1" fill="#fff"/><circle cx="40.7" cy="37.7" r="1" fill="#fff"/>
      <ellipse cx="20.5" cy="45" rx="3.6" ry="2.2" fill="#ff8a80" opacity=".6"/><ellipse cx="47.5" cy="45" rx="3.6" ry="2.2" fill="#ff8a80" opacity=".6"/>
      <path d="M30.2 43.6q1.9 2.6 3.8 0q1.9 2.6 3.8 0" fill="none" stroke="#3b1d17" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <h1 class="logo">몽몽</h1>
    <button type="button" class="iconbtn" id="aboutbtn" aria-label="안내와 출처 보기"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg></button>
    <button type="button" class="iconbtn" id="themebtn" aria-label="화면 밝기 바꾸기"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
  </header>

  <main>
    <section class="view" id="v-home" aria-label="홈"></section>
    <section class="view" id="v-search" aria-label="검색">
      <h2 class="page-title">검색</h2>
      <div class="searchbox"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.5-4.5"/></svg>
        <label class="sr" for="q">가게, 종류, 동네 검색</label><input id="q" type="search" placeholder="가게·종류·동네를 검색해 보세요" autocomplete="off"></div>
      <div id="sres"></div>
    </section>
    <section class="view" id="v-map" aria-label="지도">
      <h2 class="page-title">지도로 찾기</h2>
      <div class="scroller" id="mapareas" role="group" aria-label="동네"></div>
      <div class="mapbox"><svg class="map" id="map" viewBox="0 0 400 320" role="img" aria-label="동네 개략 지도"></svg>
        <div class="legend"><span><i class="on"></i>후기로 검증됨 · 90일 이내</span><span><i class="off"></i>검증 전 · 90일 경과</span></div></div>
      <div class="mapsum" id="mapsum"></div>
    </section>
    <section class="view" id="v-list" aria-label="큐레이션 리스트">
      <h2 class="page-title">큐레이션 리스트</h2>
      <div class="scroller" id="areas" role="group" aria-label="동네"></div>
      <div class="scroller" id="sits" role="group" aria-label="상황"></div>
      <p class="count" id="count"></p>
      <div class="cards" id="list"></div>
    </section>
    <section class="view" id="v-my" aria-label="마이"></section>
    <section id="v-detail" aria-label="가게 상세"></section>
  </main>
</div>

<script>
const AREAS = {
  "성수": { lat: 37.5440, lng: 127.0550, span: 0.022 },
  "연남": { lat: 37.5615, lng: 126.9245, span: 0.022 },
  "판교": { lat: 37.3947, lng: 127.1112, span: 0.022 },

function renderMap() {

    <text class="note" x="${W - 12}" y="${H - 10}" text-anchor="end">개략도 · 임의 배치</text>`;
  let lbl = "";
  items.forEach((p, i) => {
    const x = W / 2 + (p.lng - a.lng) / a.span * W, y = H / 2 - (p.lat - a.lat) / latSpan * H, sel = state.sel === p.id;
    g += `<g class="pin${isStale(statsOf(p)) ? " stale" : ""}${sel ? " sel" : ""}" data-id="${esc(p.id)}" transform="translate(${x.toFixed(1)} ${y.toFixed(1)})" tabindex="0" role="button" aria-label="${i + 1}번 ${esc(p.name)}"><circle r="15"/><text>${i + 1}</text></g>`;
    if (sel) { const w = Math.min(p.name.length * 11 + 18, W - 8), lx = Math.max(4 + w / 2, Math.min(W - 4 - w / 2, x)), ly = y > 44 ? y - 30 : y + 30;
      lbl = `<g class="lbl" transform="translate(${lx.toFixed(1)} ${ly.toFixed(1)})"><rect x="${-w / 2}" y="-11" width="${w}" height="22" rx="11"/><text>${esc(p.name)}</text></g>`; }
  });
  $("map").innerHTML = g + lbl;
  const sel = items.find(p => p.id === state.sel);
  $("mapsum").innerHTML = sel ? cardHtml(sel) : (items.length ? '<p class="hint">핀을 누르면 가게를 미리 볼 수 있어요.</p>' : "");

  });

    <label class="check"><input id="rv-ad" data-f="ad" type="checkbox" ${d.ad ? "checked" : ""}> 협찬·초대로 방문했습니다 (표기해야 신뢰가 유지됩니다)</label>
    ${d.err ? `<p class="err" role="alert">${esc(d.err)}</p>` : ""}
    <div class="actions"><button type="submit" class="btn" ${d.saving ? "disabled" : ""}>${d.saving ? "저장 중…" : "후기 저장"}</button><button type="button" class="btn ghost" data-act="cancel">취소</button></div></form>`;
}
function addFormHtml() {
  const d = addDraft;
  return `<form class="rvform" id="addform" novalidate><h4>가게 추가 (에디터 전용)</h4>
    <div class="two"><div class="field"><label class="flabel" for="ad-area">동네</label><select id="ad-area" data-g="area">${Object.keys(AREAS).map(a => `<option${a === d.area ? " selected" : ""}>${esc(a)}</option>`).join("")}</select></div>
      <div class="field"><label class="flabel" for="ad-cat">종류</label><input id="ad-cat" data-g="cat" type="text" maxlength="20" placeholder="예: 파스타" value="${esc(d.cat)}"></div></div>
    <div class="field"><label class="flabel" for="ad-name">가게 이름</label><input id="ad-name" data-g="name" type="text" maxlength="60" value="${esc(d.name)}"></div>
    <div class="field"><span class="flabel" id="al-sits">어울리는 상황</span><div class="checks" role="group" aria-labelledby="al-sits">${SITS.slice(1).map(s => `<label class="check"><input type="checkbox" data-g="sit" value="${esc(s)}" ${d.sits.includes(s) ? "checked" : ""}> ${esc(s)}</label>`).join("")}</div></div>
    <div class="field"><label class="flabel" for="ad-sum">한 줄 소개</label><input id="ad-sum" data-g="summary" type="text" maxlength="120" value="${esc(d.summary)}"></div>
    <div class="field"><label class="flabel" for="ad-addr">주소 (선택)</label><input id="ad-addr" data-g="addr" type="text" maxlength="120" value="${esc(d.addr)}"></div>
    ${d.err ? `<p class="err" role="alert">${esc(d.err)}</p>` : ""}
    <div class="actions"><button type="submit" class="btn" ${d.saving ? "disabled" : ""}>${d.saving ? "저장 중…" : "가게 저장"}</button><button type="button" class="btn ghost" data-act="addcancel">취소</button></div></form>`;
}

function photoControls(p) {
  if (!assetsApi || !canEdit) return "";
  const busy = photoBusy === p.id;
  return `<div class="photoact"><button type="button" class="btn ghost sm" data-act="photo" data-id="${esc(p.id)}" ${busy ? "disabled" : ""}>${busy ? "올리는 중…" : p.photo ? "사진 바꾸기" : "사진 등록"}</button>${p.photo && !busy ? `<button type="button" class="link-btn" data-act="photodel" data-id="${esc(p.id)}">사진 삭제</button>` : ""}<input type="file" id="photofile" accept="image/*" hidden data-pid="${esc(p.id)}"></div>`;
}
async function shrink(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const k = Math.min(1, 900 / Math.max(img.width, img.height)), c = document.createElement("canvas");
    c.width = Math.max(1, Math.round(img.width * k)); c.height = Math.max(1, Math.round(img.height * k));
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    return await new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error("blob")), "image/jpeg", 0.82));
  } finally { URL.revokeObjectURL(url); }
}
async function uploadPhoto(pid, file) {
  const p = PLACES.find(x => x.id === pid); if (!p || !file) return;
  photoBusy = pid; render();
  try {
    const blob = await shrink(file), r = await assetsApi.upload(blob, { type:"image/jpeg" }), old = p.photo;
    await db.doc("places/" + pid).update({ photo:r.id });
    if (old) { try { await assetsApi.delete(old); } catch (e) {} }
    alert_("사진을 등록했습니다.");
  } catch (err) { alert_(err && err.code === "too_large" ? "사진이 너무 큽니다." : err && err.code === "unsupported_type" ? "이 형식의 사진은 올릴 수 없습니다." : err && err.code === "quota_or_state" ? "저장 공간이 가득 찼습니다." : "사진을 올리지 못했습니다. 잠시 뒤 다시 시도해 주세요."); }
  photoBusy = null; render();
}
/* 상세: 가기 전에 → 찾아가기 → 다녀온 뒤 */
function renderDetail() {
  const el = $("v-detail"), p = PLACES.find(x => x.id === state.detail);
  if (!p) { el.innerHTML = ""; return; }
  const st = statsOf(p), stale = isStale(st);
  const ctx = state.from === "list" ? listItems() : state.from === "map" ? inArea(state.area) : [];
  const idx = ctx.findIndex(x => x.id === p.id), prev = idx > 0 ? ctx[idx - 1] : null, next = idx >= 0 && idx < ctx.length - 1 ? ctx[idx + 1] : null;
  const q = encodeURIComponent(p.area + " " + p.name), qn = encodeURIComponent(p.name);
  const more = [["카카오맵", `https://map.kakao.com/?q=${q}`], ["구글 지도", `https://www.google.com/maps/search/?api=1&query=${q}`], ["다이닝코드", `https://www.diningcode.com/list.dc?query=${q}`], ["캐치테이블", `https://www.google.com/search?q=${qn}+${encodeURIComponent(p.area)}+캐치테이블`]]
    .map(([t, u]) => `<a class="btn ghost sm" href="${u}" target="_blank" rel="noopener">${t} ↗</a>`).join("");
  const w = waitLine(p, st), back = { list:"리스트", map:"지도", search:"검색", home:"홈", my:"마이" }[state.from] || "목록";
  el.innerHTML = `<div class="dbar"><button type="button" class="back" data-act="back" id="backbtn"><svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>${back}</button><span class="crumb">${esc(p.area)} › ${esc(p.name)}</span></div>
    <div class="dbody">
      <div class="dhead">${thumbHtml(p, true)}<div><h2>${esc(p.name)}</h2><p class="dsum">${esc(p.area)} · ${esc(p.summary)}</p>
        <div class="rate">${st.n ? `${starsHtml(st.avg)} <span>· 후기 ${st.n}</span>` : "<span>후기 아직 없음</span>"}${st.ad ? '<span class="badge ad">협찬 후기</span>' : ""}${stale ? `<span class="badge">${staleLabel(st)}</span>` : ""}</div>${photoControls(p)}</div></div>
      <section class="card"><h3>가기 전에 <span class="when">웨이팅·예약</span></h3>
        <dl class="info"><div class="key"><dt>웨이팅 팁</dt><dd class="${w ? "" : "tbd"}">${esc(w || TBD)}</dd></div><div><dt>예약 요령</dt><dd class="${known(p.resv) ? "" : "tbd"}">${esc(p.resv || TBD)}</dd></div></dl>
        <p class="src">${st.verified ? `마지막 방문 검증 ${esc(st.verified)}` : "웹 검색 기준 정보이며 아직 직접 방문하지 않았습니다. 방문 전 공식 채널에서 확인하세요."}</p></section>
      <section class="card"><h3>찾아가기 <span class="when">위치·리뷰</span></h3>
        <dl class="info"><div><dt>주소</dt><dd class="${known(p.addr) ? "" : "tbd"}">${esc(p.addr || TBD)}</dd></div></dl>
        <a class="btn full" href="https://map.naver.com/p/search/${q}" target="_blank" rel="noopener">네이버 지도에서 열기 ↗</a><div class="btnrow">${more}</div></section>
      <section class="card" aria-label="몽몽 후기"><h3>다녀온 뒤 <span class="when">몽몽 후기 ${st.n}</span></h3>
        ${st.n ? `<ul class="rvlist">${st.rs.map(reviewHtml).join("")}</ul>` : '<p class="muted" style="margin:0">아직 후기가 없습니다. 다녀온 뒤 첫 후기를 남기면 검증일이 갱신됩니다.</p>'}
        ${state.writing === p.id && draft ? formHtml(p) : (canWrite === false ? '<p class="muted" style="margin:0">후기는 편집 권한이 있는 사람만 남길 수 있습니다.</p>' : `<button type="button" class="btn" data-act="write" data-id="${esc(p.id)}">후기 쓰기</button>`)}</section>
      ${prev || next ? `<nav class="pager" aria-label="다른 가게"><button type="button" class="btn ghost" data-act="open" data-id="${prev ? esc(prev.id) : ""}" ${prev ? "" : "disabled"}>‹ <span>${prev ? esc(prev.name) : "처음입니다"}</span></button><button type="button" class="btn ghost" data-act="open" data-id="${next ? esc(next.id) : ""}" ${next ? "" : "disabled"}><span>${next ? esc(next.name) : "마지막입니다"}</span> ›</button></nav>` : ""}
    </div>`;
}

/* 전체 그리기 */
function buildTabs() {
  $("tabs").innerHTML = TABS.map(([k, t]) => `<button type="button" class="tab" data-act="tab" data-t="${k}">${ICONS[k]}<span>${t}</span></button>`).join("");
}
function render() {
  const app = $("app"); app.dataset.tab = state.tab; app.dataset.detail = state.detail ? "1" : "0";
  document.querySelectorAll(".tab").forEach(b => { if (b.dataset.t === state.tab) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); });
  if (state.detail) { renderDetail(); return; }
  ({ home:renderHome, search:renderSearch, map:renderMap, list:renderList, my:renderMy }[state.tab])();
}
function renderKeep() {
  const a = document.activeElement, keep = a && a.id && document.body.contains(a) ? { id:a.id, s:a.selectionStart, e:a.selectionEnd } : null;
  render();
  if (keep && keep.id !== "q") { const el = document.getElementById(keep.id); if (el) { el.focus({ preventScroll:true }); try { if (keep.s != null) el.setSelectionRange(keep.s, keep.e); } catch (x) {} } }
}

/* 이동 */
function go(tab) { state.detail = null; state.writing = null; draft = null; state.tab = tab; render(); window.scrollTo({ top:0 }); if (tab === "search") $("q").focus({ preventScroll:true }); }
function openDetail(id) {
  if (!state.detail) { savedScroll = window.scrollY; state.from = state.tab; }
  state.detail = id; state.sel = id; state.writing = null; state.delArm = null; draft = null;
  render(); window.scrollTo({ top:0 }); const b = $("backbtn"); if (b) b.focus({ preventScroll:true });
}
function closeDetail() {
  const id = state.detail; state.detail = null; state.writing = null; draft = null; render(); window.scrollTo({ top:savedScroll });
  const c = document.querySelector(`.rcbtn[data-id="${CSS.escape(id || "")}"]`); if (c) c.focus({ preventScroll:true });
}
document.addEventListener("keydown", e => { if (e.key === "Escape" && state.detail) closeDetail(); });
function alert_(msg) { document.querySelectorAll(".toast").forEach(t => t.remove()); const n = document.createElement("div"); n.className = "toast"; n.setAttribute("role", "status"); n.textContent = msg; document.body.appendChild(n); setTimeout(() => n.remove(), 3500); }

/* 테마 */
function applyTheme(t) { document.documentElement.setAttribute("data-theme", t); try { localStorage.setItem("mongmong-theme", t); } catch (e) {} }
$("themebtn").onclick = () => { const cur = document.documentElement.getAttribute("data-theme") || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"); applyTheme(cur === "dark" ? "light" : "dark"); };
$("aboutbtn").onclick = () => { go("my"); const a = $("about"); if (a) a.scrollIntoView({ block:"start" }); };
try { const t = localStorage.getItem("mongmong-theme"); if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t); } catch (e) {}

/* 이벤트 */
document.addEventListener("click", async e => {
  const t = e.target.closest("[data-act]"); if (!t || t.disabled) return;
  const act = t.dataset.act;
  if (act === "tab") go(t.dataset.t);
  else if (act === "open") { if (t.dataset.id) openDetail(t.dataset.id); }
  else if (act === "back") closeDetail();
  else if (act === "photo") { const f = $("photofile"); if (f) f.click(); }
  else if (act === "photodel") { const p = PLACES.find(x => x.id === t.dataset.id); if (!p || !p.photo) return; const old = p.photo; try { await db.doc("places/" + p.id).update({ photo:"" }); try { await assetsApi.delete(old); } catch (e) {} alert_("사진을 삭제했습니다."); } catch (err) { alert_("삭제하지 못했습니다."); } }
  else if (act === "area") { state.area = t.dataset.a; state.sit = "전체"; state.sel = null; go("list"); }
  else if (act === "setarea") { state.area = t.dataset.v; state.sel = null; render(); const b = document.querySelector(`[data-act="setarea"][data-v="${CSS.escape(state.area)}"]`); if (b) b.scrollIntoView({ inline:"center", block:"nearest" }); }
  else if (act === "setsit") { state.sit = t.dataset.v; render(); }
  else if (act === "allsit") { state.sit = "전체"; render(); }
  else if (act === "kw") { state.q = t.dataset.k; $("q").value = state.q; renderSearch(); }
  else if (act === "write") { state.writing = t.dataset.id; draft = { rating:0, visited:todayStr(), wait:"", text:"", tip:"", ad:false, err:"", saving:false }; render(); const f = $("rv-text"); if (f) { f.scrollIntoView({ block:"center" }); f.focus({ preventScroll:true }); } }
  else if (act === "cancel") { state.writing = null; draft = null; render(); }
  else if (act === "rate") { draft.rating = +t.dataset.v; draft.err = ""; render(); const b = document.querySelector(`.star[data-v="${draft.rating}"]`); if (b) b.focus({ preventScroll:true }); }
  else if (act === "del") {
    const rid = t.dataset.rid;
    if (state.delArm !== rid) { state.delArm = rid; render(); setTimeout(() => { if (state.delArm === rid) { state.delArm = null; render(); } }, 4000); return; }
    state.delArm = null;
    try { await db.doc("reviews/" + rid).delete(); } catch (err) { alert_(`삭제하지 못했습니다 (${err.code || "오류"})`); }
  }
  else if (act === "addopen") { state.adding = true; addDraft = { area:state.area, cat:"", name:"", sits:[], summary:"", addr:"", err:"", saving:false }; render(); const f = $("ad-name"); if (f) f.focus(); }
  else if (act === "addcancel") { state.adding = false; addDraft = null; render(); }
});
$("q").addEventListener("input", e => { state.q = e.target.value; renderSearch(); });
document.addEventListener("change", e => { if (e.target.id === "photofile") { const f = e.target.files && e.target.files[0]; if (f) uploadPhoto(e.target.dataset.pid, f); } });
document.addEventListener("input", e => {
  const f = e.target.dataset.f, g = e.target.dataset.g;
  if (f && draft) { draft[f] = e.target.type === "checkbox" ? e.target.checked : e.target.value; if (draft.err) { draft.err = ""; const er = document.querySelector(".rvform .err"); if (er) er.remove(); } }
  if (g && addDraft) { if (g === "sit") addDraft.sits = [...document.querySelectorAll('[data-g="sit"]:checked')].map(x => x.value); else addDraft[g] = e.target.value; }
});
document.addEventListener("submit", async e => {
  e.preventDefault();
  if (e.target.id === "addform") return saveAdd();
  const pid = e.target.dataset.pid, d = draft;
  if (!d || d.saving) return;
  const fail = m => { d.err = m; render(); };
  if (d.rating < 1) return fail("별점을 골라 주세요.");
  if (!/^\d{4}-\d{2}-\d{2}$/.test(d.visited) || d.visited > todayStr()) return fail("방문일을 오늘 이전 날짜로 입력해 주세요.");
  if (d.text.trim().length < 2) return fail("한 줄 후기를 2자 이상 적어 주세요.");
  const wait = d.wait === "" ? null : Number(d.wait);
  if (wait !== null && (!Number.isFinite(wait) || wait < 0 || wait > 600)) return fail("대기 시간은 0~600분 사이로 입력해 주세요.");
  d.saving = true; d.err = ""; render();
  try {
    await db.collection("reviews").add({ placeId:pid, rating:d.rating, visited:d.visited, wait, text:d.text.trim(), tip:d.tip.trim(), ad:!!d.ad, uid:me, createdAt:new Date().toISOString() });
    state.writing = null; draft = null; render(); alert_("후기를 저장했습니다. 검증일이 갱신됩니다.");
  } catch (err) {
    d.saving = false;
    fail(err.code === "invalid_argument" ? "이 링크에서는 후기를 남길 권한이 없습니다." : err.code === "quota_exceeded" ? "저장 공간이 가득 찼습니다." : "저장하지 못했습니다. 잠시 뒤 다시 시도해 주세요.");
  }
});
async function saveAdd() {
  const d = addDraft; if (!d || d.saving) return;
  const fail = m => { d.err = m; render(); };
  if (!d.name.trim()) return fail("가게 이름을 입력해 주세요.");
  if (!d.cat.trim()) return fail("종류를 입력해 주세요.");
  if (!d.sits.length) return fail("어울리는 상황을 하나 이상 골라 주세요.");
  if (PLACES.some(p => p.area === d.area && p.name === d.name.trim())) return fail("이 동네에 같은 이름의 가게가 이미 있습니다.");
  const n = PLACES.reduce((m, p) => Math.max(m, p.order || 0), 0) + 1;
  const idx = inArea(d.area).length, o = OFFS[idx % 5], k = 1 + Math.floor(idx / 5) * 0.5, a = AREAS[d.area];
  d.saving = true; d.err = ""; render();
  try {
    await db.doc("places/p" + n).set({ order:n, area:d.area, name:d.name.trim(), cat:d.cat.trim(), sits:d.sits, summary:d.summary.trim() || TBD, wait:TBD, resv:TBD, addr:d.addr.trim() || TBD, lat:+(a.lat + o[0] * k).toFixed(4), lng:+(a.lng + o[1] * k).toFixed(4) });
    state.adding = false; addDraft = null; state.area = d.area; render(); alert_("가게를 추가했습니다.");
  } catch (err) { d.saving = false; fail("저장하지 못했습니다. 에디터 권한이 필요합니다."); }
}

async function init() {
  buildTabs(); render();
  const c = window.claude;
  if (!c || !c.use) { status = "nodb"; render(); return; }
  try {
    const [dbm, user, asts] = await Promise.all([c.use("db"), c.use("user"), c.use("assets")]);
    assetsApi = asts || null;
    if (!dbm) { status = "nodb"; render(); return; }
    db = dbm;
    if (user) { me = await user.id(); canEdit = !!(await user.canEdit()); canWrite = await user.can("data.write"); }
    let got = 0;
    const done = () => { if (++got === 2) status = "ok"; render(); };
    const fail = () => { status = "error"; render(); };
    db.collection("places").onSnapshot(s => { PLACES = s.docs.map(d => ({ ...d.data(), id:d.id })).sort((a, b) => (a.order || 0) - (b.order || 0)); got < 2 ? done() : renderKeep(); }, fail);
    db.collection("reviews").onSnapshot(s => { REVIEWS = s.docs.map(d => ({ ...d.data(), id:d.id })); got < 2 ? done() : renderKeep(); }, fail);
  } catch (e) { status = "nodb"; render(); }
}
init();
</script>
